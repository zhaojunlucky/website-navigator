<main class="main" style="flex-direction: column; align-items: stretch;">
  <!-- Loading Layer -->
  <div *ngIf="navigation === null" class="loading-container" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; width: 100%;">
    <mat-spinner diameter="50"></mat-spinner>
    <p style="margin-top: 20px; font-size: 18px; color: #555;">Loading navigation data...</p>
  </div>

  <!-- Main Content - Only shown when navigation is loaded -->
  <ng-container *ngIf="navigation !== null">
    <!-- Top Navigation Search Bar -->
    <mat-toolbar  class="mat-elevation-z2">
      <!-- Removed search icon -->
      <form (submit)="onSearch(); $event.preventDefault();" style="flex:1; display:flex; align-items:center;">
        <input matInput
               placeholder="Search the web..."
               [(ngModel)]="searchQuery"
               name="search"
               style="margin-left:8px; flex:1; min-width:0; font-size: 1.25rem; height: 3rem; padding: 0 1rem; border-radius: 0.5rem;"
               (input)="onSearchInputChange()"
               [matAutocomplete]="auto" />

        <mat-autocomplete #auto="matAutocomplete">
          <mat-option *ngFor="let item of filteredItems" [value]="item.name" (click)="selectItem(item)">
            <div style="display: flex; align-items: center; gap: 8px;">
              <img [src]="getFaviconUrl(item)" alt="favicon" style="width: 16px; height: 16px;" />
              <span>{{ item.name }}</span>
              <span style="color: #777; font-size: 0.8em; margin-left: auto;">{{ item.category }}</span>
            </div>
          </mat-option>
        </mat-autocomplete>

        <button mat-icon-button type="submit" aria-label="Search">
          <mat-icon>arrow_forward</mat-icon>
        </button>
        
        <!-- Menu Button -->
        <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Menu">
          <mat-icon>more_vert</mat-icon>
        </button>
        
        <!-- Menu -->
        <mat-menu #menu="matMenu">
          <button mat-menu-item (click)="refreshNavigation()">
            <mat-icon>refresh</mat-icon>
            <span>Refresh Navigation</span>
          </button>
        </mat-menu>
      </form>
    </mat-toolbar>

    <!-- Category Navigation -->
    <div class="categories-container">
      <mat-accordion multi>
        <mat-expansion-panel *ngFor="let category of navigation.categories; let i = index" [expanded]="i === 0">
          <mat-expansion-panel-header>
            <mat-panel-title>
              <mat-icon>{{ category.icon || "folder" }}</mat-icon>
              {{ category.name }}
            </mat-panel-title>
          </mat-expansion-panel-header>
          <div class="category-items flex-row" style="display: flex; flex-direction: row; flex-wrap: wrap; gap: 0.5rem; width: 100%;">
            <a *ngFor="let item of category.items" class="nav-link" [href]="item.content" rel="noopener" matRipple
               [matTooltip]="item.name + ' (' + item.content + ')'">
              <img src="{{getFaviconUrl(item)}}" alt="favicon" class="favicon" />
              <span title="{{ item.name }}">{{ item.name }}</span>
            </a>
          </div>
        </mat-expansion-panel>
      </mat-accordion>
    </div>
  </ng-container>

  <!-- Back to Top Button -->
  <button
    *ngIf="showBackToTopButton"
    mat-fab
    color="primary"
    class="back-to-top-btn"
    (click)="scrollToTop()"
    matTooltip="Back to top">
    <mat-icon>arrow_upward</mat-icon>
  </button>
</main>
